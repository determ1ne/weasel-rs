[package]
name = "weasel-theme-wasm"
version = "0.1.2"
edition = "2024"
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"
# 运行时选型：wasmtime（wasmer 7.x 在 Windows 上 cranelift/singlepass 被
# compile_error 禁用，只剩需下载预编译 V8 的 v8 后端，故弃用）。
# 仅启用同步 runtime + cranelift；不使用 async/component-model 等重型特性。
wasmtime = { version = "48", default-features = false, features = ["runtime", "cranelift", "std"] }
weasel-common = { path = "../../common" }
weasel-theme-api = { path = "../../theme-api" }
weasel-theme-support = { path = "../support" }
windows-core = "0.100.0"
windows-numerics = "0.100.0"
windows-version = "0.100.0"
windows-strings = "0.100.0"

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
wat = "1"
