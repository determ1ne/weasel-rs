syntax = "proto3";

package weasel.message;
import "tip.proto";

// stdout transport of --deploy-ui. A frame is u32 LE length + DeployEvent.
message DeployEvent {
  oneof payload {
    DeployLog log = 1;
    DeployComplete complete = 2;
  }
}
message DeployLog {
  string stream = 1;
  string text = 2;
}
message DeployComplete {
  bool success = 1;
  optional int32 exit_code = 2;
  string message = 3;
}

// refresh requests a fresh read from disk for this call only (used by the
// preview so a just-edited configuration is reflected); it does not replace
// the broker's published snapshot.
// Unreadable/invalid disk overrides return Failure instead of a misleading
// preview using partially accepted settings. Missing files use normal defaults.
message GetSettings {
  bool refresh = 1;
}
message Settings {
  string theme = 1;
  // Complete merged configuration as a JSON object (not original file bytes).
  // Uses the same source as theme: published normally, disk when refresh=true.
  // Backends currently carry this opaque object; individual style keys are not
  // interpreted yet. Each fallback backend must select its own settings from it.
  string theme_settings = 2;
}

message Shutdown {
  string reason = 1;
}

message ShutdownResponse {
  bool accepted = 1;
  string message = 2;
}

message RenderItem {
  string primary_text = 1;
  string secondary_text = 2;
  bool enabled = 3;
  string kind = 4;
}

message RenderSnapshot {
  uint64 session_id = 1;
  uint64 revision = 2;
  bool visible = 3;
  RenderRect anchor = 4;
  repeated RenderItem items = 5;
  uint32 selected_index = 6;
  uint32 page_start = 7;
  // Absent when the engine only exposes page-local candidates.
  optional uint32 total_item_count = 8;
  bool can_page_previous = 9;
  bool can_page_next = 10;
  ContextToken token = 11;
  // Global presentation order within one server/renderer connection owner.
  // Independent of per-input revision: focus, hide and layout also advance it.
  uint64 sequence = 12;
}

enum RendererEventAction {
  RENDERER_EVENT_ACTION_UNSPECIFIED = 0;
  RENDERER_EVENT_ACTION_ITEM_INVOKED = 1;
  RENDERER_EVENT_ACTION_NAVIGATE_PREVIOUS = 2;
  RENDERER_EVENT_ACTION_NAVIGATE_NEXT = 3;
  RENDERER_EVENT_ACTION_DISMISS = 4;
  RENDERER_EVENT_ACTION_OPEN_EMOJI_PANEL = 5;
}

message RendererEvent {
  uint64 session_id = 1;
  RendererEventAction action = 2;
  uint32 item_index = 3;
  ContextToken token = 4;
  uint64 revision = 5;
}
