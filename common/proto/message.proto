syntax = "proto3";

package weasel.message;
import "tip.proto";

// stdout transport of --deploy-ui. A frame is u32 LE length + DeployEvent.
message DeployEvent {
  oneof payload {
    DeployLog log = 1;
    DeployComplete complete = 2;
  }
}
message DeployLog {
  string stream = 1;
  string text = 2;
}
message DeployComplete {
  bool success = 1;
  optional int32 exit_code = 2;
  string message = 3;
}

// refresh requests a fresh read from disk for this call only (used by the
// preview so a just-edited configuration is reflected); it does not replace
// the broker's published snapshot.
// Unreadable/invalid disk overrides return Failure instead of a misleading
// preview using partially accepted settings. Missing files use normal defaults.
message QueryConfig {
  bool refresh = 1;
  string path = 2;
}

// Component-to-broker user notification. Transport is independent of Toast/UI.
// Never include input text or other secrets in diagnostic details.
enum UserNotificationSeverity {
  USER_NOTIFICATION_SEVERITY_UNSPECIFIED = 0;
  USER_NOTIFICATION_SEVERITY_INFO = 1;
  USER_NOTIFICATION_SEVERITY_WARNING = 2;
  USER_NOTIFICATION_SEVERITY_ERROR = 3;
}
message UserNotification {
  string source = 1;
  string code = 2;
  UserNotificationSeverity severity = 3;
  string title = 4;
  string message = 5;
  string details = 6;
}
// Broker-only control plane; does not change the TIP input contract.
message IdentifyService {}
message ServiceIdentity {
  uint32 pid = 1;
  string component = 2;
  string owner_token = 3;
  string instance = 4;
  bool ready = 5;
}
message ConfigValue {
  // Absent means missing; the string "null" is a present JSON null value.
  optional string json = 1;
}

message Shutdown {
  string reason = 1;
}

message ShutdownResponse {
  bool accepted = 1;
  string message = 2;
}

message RenderItem {
  string primary_text = 1;
  string secondary_text = 2;
  bool enabled = 3;
  string kind = 4;
}

message RenderSnapshot {
  uint64 session_id = 1;
  uint64 revision = 2;
  bool visible = 3;
  RenderRect anchor = 4;
  repeated RenderItem items = 5;
  uint32 selected_index = 6;
  uint32 page_start = 7;
  // Absent when the engine only exposes page-local candidates.
  optional uint32 total_item_count = 8;
  bool can_page_previous = 9;
  bool can_page_next = 10;
  ContextToken token = 11;
  // Global presentation order within one server/renderer connection owner.
  // Independent of per-input revision: focus, hide and layout also advance it.
  uint64 sequence = 12;
  // Present only when preedit is displayed outside the host application.
  RenderPreedit preedit = 13;
}

message RenderPreedit {
  string text = 1;
  uint32 cursor_utf16 = 2;
}

enum RendererEventAction {
  RENDERER_EVENT_ACTION_UNSPECIFIED = 0;
  RENDERER_EVENT_ACTION_ITEM_INVOKED = 1;
  RENDERER_EVENT_ACTION_NAVIGATE_PREVIOUS = 2;
  RENDERER_EVENT_ACTION_NAVIGATE_NEXT = 3;
  RENDERER_EVENT_ACTION_DISMISS = 4;
  RENDERER_EVENT_ACTION_OPEN_EMOJI_PANEL = 5;
}

message RendererEvent {
  uint64 session_id = 1;
  RendererEventAction action = 2;
  uint32 item_index = 3;
  ContextToken token = 4;
  uint64 revision = 5;
}
