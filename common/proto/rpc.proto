syntax = "proto3";
package weasel.message;
import "message.proto";
import "tip.proto";

// This is the only Named Pipe wire envelope. Peers require matching versions.
message RpcFrame {
  uint32 protocol_version = 1;
  oneof body {
    Hello hello = 20;
    Request request = 21;
    Response response = 22;
    Event event = 23;
  }
}
enum PeerRole { PEER_ROLE_UNSPECIFIED = 0; PEER_ROLE_TIP = 1; PEER_ROLE_BROKER = 2; PEER_ROLE_SERVER = 3; PEER_ROLE_RENDERER = 4; }
message Hello { PeerRole role = 1; uint64 instance_id = 2; }
message Request {
  uint64 id = 1;
  oneof operation { Ping ping = 10; InputKey key = 11; ContextCommand context = 12; Shutdown shutdown = 13; OpenInput open_input = 14; QueryConfig query_config = 15; }
}
message Response {
  uint64 id = 1;
  oneof result { Pong pong = 10; InputResult input = 11; ShutdownResponse shutdown = 12; Failure failure = 13; InputOpened input_opened = 14; ConfigValue config_value = 15; }
}
message Event {
  oneof notification { LogEvent diagnostic = 10; InputResult input = 11; RenderSnapshot render = 12; RendererEvent interaction = 13; LayoutUpdate layout = 14; }
}
