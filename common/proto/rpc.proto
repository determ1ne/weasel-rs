syntax = "proto3";
package weasel.message;
import "message.proto";

// This is the only Named Pipe wire envelope. Version 2 deliberately rejects v1.
message RpcFrame {
  uint32 protocol_version = 1;
  oneof body {
    Hello hello = 20;
    Request request = 21;
    Response response = 22;
    Event event = 23;
  }
}
enum PeerRole { PEER_ROLE_UNSPECIFIED = 0; PEER_ROLE_TIP = 1; PEER_ROLE_BROKER = 2; PEER_ROLE_SERVER = 3; PEER_ROLE_RENDERER = 4; }
message Hello { PeerRole role = 1; uint64 instance_id = 2; }
message Request {
  uint64 id = 1;
  oneof operation { Ping ping = 10; InputKey key = 11; ContextCommand context = 12; Shutdown shutdown = 13; OpenInput open_input = 14; }
}
message OpenInput { ContextToken token = 1; }
message InputOpened { ContextToken token = 1; }
message InputKey {
  ContextToken token = 1;
  int32 keycode = 2;
  int32 modifiers = 3;
  bool released = 4;
  uint32 virtual_key = 5;
  int64 native_lparam = 6;
}
message Response {
  uint64 id = 1;
  oneof result { Pong pong = 10; InputResult input = 11; ShutdownResponse shutdown = 12; Failure failure = 13; InputOpened input_opened = 14; }
}
message Pong { string text = 1; }
enum FailureCode { FAILURE_CODE_UNSPECIFIED = 0; FAILURE_CODE_INVALID_ARGUMENT = 1; FAILURE_CODE_NOT_READY = 2; FAILURE_CODE_OVERLOADED = 3; FAILURE_CODE_STALE_CONTEXT = 4; FAILURE_CODE_INTERNAL = 5; }
message Failure { FailureCode code = 1; string message = 2; }
message Event {
  oneof notification { LogEvent diagnostic = 10; InputResult input = 11; RenderSnapshot render = 12; RendererEvent interaction = 13; LayoutUpdate layout = 14; }
}
// State is optional: an unhandled key acknowledgement must not clear preedit.
// Effects are one-shot and must be applied once in token/revision wire order.
message InputResult {
  ContextToken token = 1;
  uint64 revision = 2;
  bool handled = 3;
  InputState state = 4;
  EditEffects effects = 5;
  optional bool ascii_mode = 6;
}
message InputState {
  string preedit = 1;
  uint32 cursor_utf16 = 2;
  bool composing = 3;
  repeated Candidate candidates = 4;
  uint32 selected = 5;
  uint32 page_start = 6;
  bool has_previous = 7;
  bool has_next = 8;
}
// Commit finalizes the active preedit (or inserts when none exists); a provided
// state may then start the next preedit. Emoji invocation cancels preedit first.
message EditEffects { string commit = 1; bool open_emoji_panel = 2; }
