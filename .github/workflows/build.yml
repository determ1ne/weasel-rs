name: Build Windows installer

on:
  push:
    tags:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    outputs:
      version: ${{ steps.build.outputs.version }}
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
      WINSPARKLE_APPCAST_URL: ${{ vars.WINSPARKLE_APPCAST_URL }}
      WINSPARKLE_PUBLIC_KEY: ${{ vars.WINSPARKLE_PUBLIC_KEY }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Prepare build environment
        run: ./scripts/prepare-ci.ps1

      - name: Build and package
        id: build
        run: ./scripts/build-ci.ps1

      - name: Upload installer and checksum
        uses: actions/upload-artifact@v7
        with:
          name: Weasel-RS-${{ steps.build.outputs.version }}-x64
          path: |
            artifacts/installer/Weasel-RS-${{ steps.build.outputs.version }}-x64-setup.exe
            artifacts/installer/Weasel-RS-${{ steps.build.outputs.version }}-x64-setup.exe.sha256
            artifacts/installer/Weasel-RS-${{ steps.build.outputs.version }}-x64-mini-setup.exe
            artifacts/installer/Weasel-RS-${{ steps.build.outputs.version }}-x64-mini-setup.exe.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    environment: release-signing
    runs-on: windows-2022
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Check out signing script
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download installer and checksum
        uses: actions/download-artifact@v7
        with:
          name: Weasel-RS-${{ needs.build.outputs.version }}-x64
          path: release-assets

      - name: Prepare WinSparkle signer
        shell: pwsh
        run: ./scripts/download_winsparkle.ps1

      - name: Sign Mini installer
        shell: pwsh
        env:
          WINSPARKLE_PRIVATE_KEY: ${{ secrets.WINSPARKLE_PRIVATE_KEY }}
          WINSPARKLE_PUBLIC_KEY: ${{ vars.WINSPARKLE_PUBLIC_KEY || 'GAmmGQQoLRtAPyTj3s2gtK9NfVnlcqPHaGJbDF3Zc9E=' }}
          BUILD_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -cne "v$env:BUILD_VERSION") { throw 'Release tag and Cargo version differ.' }
          ./scripts/sign-update.ps1 -Installer "release-assets/Weasel-RS-$env:BUILD_VERSION-x64-mini-setup.exe" -PublicKey $env:WINSPARKLE_PUBLIC_KEY

      - name: Attach installer to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          BUILD_VERSION: ${{ needs.build.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = "release-assets/Weasel-RS-$env:BUILD_VERSION-x64-setup.exe"
          $mini = "release-assets/Weasel-RS-$env:BUILD_VERSION-x64-mini-setup.exe"
          $assets = @($installer, "$installer.sha256", $mini, "$mini.sha256", "$mini.edSignature")
          foreach ($file in $assets) {
            if (!(Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing release asset: $file" }
          }
          gh release view $env:RELEASE_TAG --json id
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --verify-tag --draft --title $env:RELEASE_TAG --notes ''
            if ($LASTEXITCODE -ne 0) { throw 'Unable to create release draft.' }
          }
          gh release upload $env:RELEASE_TAG @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Unable to upload release assets.' }
